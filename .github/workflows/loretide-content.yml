name: Loretide content contracts
on:
  push:
    branches: [app-main]
  pull_request:
    branches: [app-main]
permissions:
  contents: read
jobs:
  boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @multica/web...
      - run: node --test scripts/check-content-boundaries.test.mjs
      - run: node scripts/check-content-boundaries.mjs
      - run: pnpm check:diagnostics-contract
      # Non-UI checks only. Per Loretide policy, UI unit tests (React hook /
      # DOM behaviour) are NOT run in CI and are not acceptance evidence; see
      # docs/development/README.md and docs/development/ci-diagnostics.md. The
      # test sources are kept in the repo, only their CI execution is removed:
      #   - packages/core content/diagnostics/queries.test.tsx (useDiagnosticStream React hook, jsdom)
      #   - apps/web platform/content-diagnostics.test.ts (download via DOM anchor/URL, jsdom)
      - run: pnpm --filter @multica/core exec vitest run content/diagnostics/contract.test.ts
      - run: pnpm --filter @multica/views exec vitest run locales/parity.test.ts
      - run: pnpm --filter @multica/web typecheck
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Native PostgreSQL fixture (no Docker)
        run: sudo systemctl start postgresql
      - name: Provision dedicated diagnostics database and least-privilege role
        run: |
          set -euo pipefail
          # Random per-run credential; never echoed. Registered as a log mask so
          # any accidental downstream print is redacted by the runner.
          PGPW="$(openssl rand -hex 24)"
          echo "::add-mask::$PGPW"
          # Admin (postgres) is used ONLY to provision. The diagnostics role is
          # NOSUPERUSER/NOCREATEDB/NOCREATEROLE and owns just its own database,
          # which lets the integration test create/drop its temporary schema and
          # objects without any cluster-wide privilege.
          sudo -u postgres psql -v ON_ERROR_STOP=1 -q -v pw="$PGPW" <<'SQL'
          DROP DATABASE IF EXISTS loretide_diag_ci;
          DROP ROLE IF EXISTS loretide_diag;
          CREATE ROLE loretide_diag LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD :'pw';
          CREATE DATABASE loretide_diag_ci OWNER loretide_diag;
          SQL
          DIAG_URL="postgres://loretide_diag:${PGPW}@127.0.0.1:5432/loretide_diag_ci?sslmode=disable"
          echo "::add-mask::$DIAG_URL"
          # Exported to later steps via the environment file; the value is masked
          # so it is not printed even if a later step dumps the environment.
          printf 'LORETIDE_DIAG_TEST_DATABASE_URL=%s\n' "$DIAG_URL" >> "$GITHUB_ENV"
      - name: Verify least-privilege database identity (fail closed)
        run: |
          set -euo pipefail
          # Read-only verification, run AS the diagnostics role. Prints only the
          # boolean role attributes (no user, host, database name or password on
          # the connection string). Any deviation stops the job before tests run,
          # so a superuser or over-privileged role can never reach the suite.
          attrs="$(psql "$LORETIDE_DIAG_TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "SELECT r.rolsuper::text||' '||r.rolcreatedb::text||' '||r.rolcreaterole::text||' '||(pg_get_userbyid((SELECT datdba FROM pg_database WHERE datname = current_database())) = current_user)::text FROM pg_roles r WHERE r.rolname = current_user")"
          echo "diagnostics role (rolsuper rolcreatedb rolcreaterole own_db): $attrs"
          if [ "$attrs" != "false false false true" ]; then
            echo "::error::diagnostics database identity/permission check failed; refusing to run integration tests"
            exit 1
          fi
      - name: Isolated diagnostic contracts and execution gates
        working-directory: server
        run: |
          set -euo pipefail
          # LORETIDE_DIAG_TEST_DATABASE_URL comes from the provisioning step via
          # $GITHUB_ENV and points at the least-privilege role. -race surfaces any
          # concurrency defect; failures are not swallowed (set -e + non-zero exit).
          go test -race ./internal/content/diagnostics -count=1
          go test ./pkg/executionpolicy ./pkg/agent ./internal/daemon/execenv -run 'TestMissingPolicy|TestConfiguredPolicy|TestLoretide' -count=1
          go test ./internal/migrations -run 'TestMigrationNumericPrefixesAreUnique|TestMigrationFilesHaveMatchingDirections|TestContentMigrationConstraints' -count=1
          go build ./cmd/server

  # The two package-wide database test suites, each on its own runner with its
  # own database and role.
  #
  # It began as Issue #98's PR-scoped gate, which ran ten named tests on the
  # one branch that needed them. Issue #102 made both suites fail closed — they
  # now refuse to start without the full LORETIDE_DB_TEST_* contract — so they
  # need a job that provisions one on every branch, not just that one. The
  # derivation, verification and least-privilege provisioning below are that
  # job's, kept; what changed is that it is no longer branch-scoped, that each
  # suite gets its own database, and that it runs the WHOLE package rather than
  # a hand-listed subset.
  #
  # It is a separate job and database from the diagnostics fixture above: these
  # packages require the complete application schema.
  #
  # The isolation boundary is this job — a fresh runner and a database created
  # for one run, dropped afterwards. The environment variables, the name prefix
  # and the loopback address are not the boundary; they are how the suite checks
  # it is pointed where this job put it, and anyone who can set them can satisfy
  # them.
  #
  # Contract: docs/development/testing-database-suites.md
  db-suites:
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Independent: one suite failing must not leave the other unreported.
      fail-fast: false
      matrix:
        include:
          - suite: handler
            slug: handler
          - suite: cmd-server
            slug: cmdserver
    concurrency:
      group: loretide-db-suites-${{ matrix.slug }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Derivation and validation are repeated in every step that acts on the
      # database rather than trusting an earlier step's export: a step that
      # drops a database has to re-derive the name it is allowed to drop.
      - name: Derive run-specific database identifiers
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::GITHUB_RUN_ID and GITHUB_RUN_ATTEMPT must be decimal integers"
            exit 1
          fi

          expected_db="loretide_db_test_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          expected_role="loretide_db_role_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [[ ! "$expected_db" =~ ^loretide_db_test_[a-z]+_[0-9]+_[0-9]+$ ||
                ! "$expected_role" =~ ^loretide_db_role_[a-z]+_[0-9]+_[0-9]+$ ]]; then
            echo "::error::derived database identifiers failed the allowlist"
            exit 1
          fi

          {
            printf 'LORETIDE_DB_TESTS=1\n'
            printf 'LORETIDE_DB_TEST_DATABASE=%s\n' "$expected_db"
            printf 'LORETIDE_DB_TEST_ROLE=%s\n' "$expected_role"
            printf 'LORETIDE_DB_TEST_RUN_ID=%s_%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'LORETIDE_DB_TEST_SUITE=%s\n' "${{ matrix.suite }}"
          } >> "$GITHUB_ENV"

      - name: Start native PostgreSQL
        run: sudo systemctl start postgresql

      - name: Provision isolated least-privilege database
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid GitHub run identity; refusing database provisioning"
            exit 1
          fi

          expected_db="loretide_db_test_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          expected_role="loretide_db_role_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [[ "${LORETIDE_DB_TEST_DATABASE:-}" != "$expected_db" ||
                "${LORETIDE_DB_TEST_ROLE:-}" != "$expected_role" ]]; then
            echo "::error::run-derived database identifiers are missing or inconsistent; refusing provisioning"
            exit 1
          fi

          pg_password="$(openssl rand -hex 24)"
          echo "::add-mask::$pg_password"

          # NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS is the
          # contract the Go guard verifies from the other side: a suite that can
          # create databases is not the role this job provisioned.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -q \
            -v db_name="$expected_db" -v role_name="$expected_role" -v pw="$pg_password" <<'SQL'
          SELECT pg_terminate_backend(pid)
            FROM pg_stat_activity
           WHERE datname = :'db_name' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS :"db_name";
          DROP ROLE IF EXISTS :"role_name";
          CREATE ROLE :"role_name"
            LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
            PASSWORD :'pw';
          CREATE DATABASE :"db_name" OWNER :"role_name";
          SQL

          # These two required extensions are installed by the cluster admin;
          # optional pg_bigm/pg_cron migrations retain their own skip behavior.
          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -q -d "$expected_db" <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

          database_url="postgres://${expected_role}:${pg_password}@127.0.0.1:5432/${expected_db}?sslmode=disable"
          echo "::add-mask::$database_url"
          printf 'LORETIDE_DB_TEST_DATABASE_URL=%s\n' "$database_url" >> "$GITHUB_ENV"

      # The same checks the Go guard makes, before Go starts. Defence in depth
      # against one miswiring, not two independent proofs: both read the same
      # environment.
      - name: Verify isolated database identity and role attributes
        working-directory: server
        run: bash scripts/verify-db-test-target.sh

      # The only place a generic DATABASE_URL exists, scoped to this command.
      # It is not exported, so the test step cannot inherit it — an inherited
      # generic URL is what made the old default dangerous.
      - name: Apply full application schema
        working-directory: server
        shell: bash
        run: DATABASE_URL="$LORETIDE_DB_TEST_DATABASE_URL" go run ./cmd/migrate up

      # A schema contract from Issue #98. It needs a migrated database and this
      # is the cheapest job that has one; the handler leg runs it so it is
      # asserted once per run rather than once per suite.
      - name: Verify migration 482 ledger and profile column contract
        if: ${{ matrix.suite == 'handler' }}
        shell: bash
        run: |
          set -euo pipefail
          ledger_count="$(psql "$LORETIDE_DB_TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 \
            -c "SELECT count(*) FROM schema_migrations WHERE version = '482_content_account_revision_profile'")"
          if [[ "$ledger_count" != "1" ]]; then
            echo "::error::migration 482 is not recorded exactly once in schema_migrations"
            exit 1
          fi

          profile_shape="$(psql "$LORETIDE_DB_TEST_DATABASE_URL" -X -A -t -v ON_ERROR_STOP=1 -c \
            "SELECT format_type(a.atttypid, a.atttypmod) || '|' || a.attnotnull::text || '|' || COALESCE(pg_get_expr(d.adbin, d.adrelid), '') FROM pg_attribute a JOIN pg_class c ON c.oid = a.attrelid JOIN pg_namespace n ON n.oid = c.relnamespace LEFT JOIN pg_attrdef d ON d.adrelid = a.attrelid AND d.adnum = a.attnum WHERE n.nspname = 'public' AND c.relname = 'content_account_revision' AND a.attname = 'profile' AND NOT a.attisdropped")"
          echo "migration 482 profile shape (type|not_null|default): $profile_shape"
          if [[ "$profile_shape" != "jsonb|true|'{}'::jsonb" ]]; then
            echo "::error::content_account_revision.profile does not match migration 482's type/nullability/default contract"
            exit 1
          fi

      # The whole package, not a hand-listed subset. The named-test manifest
      # made sense while one branch needed evidence for ten cases; as the
      # permanent gate for two suites it would silently stop covering every
      # test added after it was written.
      - name: Run the ${{ matrix.suite }} database suite
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/test-go-db.sh --suite "${{ matrix.suite }}" --json \
            | tee "$RUNNER_TEMP/${{ matrix.slug }}.jsonl"

      # A package-level pass is not evidence that anything ran — that is the
      # exact failure Issue #102 repairs — so this counts terminal per-test
      # events and treats zero passes as red.
      - name: Require per-test pass evidence
        shell: bash
        run: |
          set -euo pipefail
          node - "$RUNNER_TEMP/${{ matrix.slug }}.jsonl" "${{ matrix.suite }}" <<'NODE'
          const fs = require('node:fs');
          const [file, suite] = process.argv.slice(2);

          if (!fs.existsSync(file) || fs.statSync(file).size === 0) {
            throw new Error(`${suite}: the JSON event file is missing or empty`);
          }
          const events = fs.readFileSync(file, 'utf8')
            .split(/\r?\n/)
            .filter((line) => line.startsWith('{'))
            .map((line) => JSON.parse(line));

          const terminal = new Map();
          for (const event of events) {
            if (!event.Test || !['pass', 'fail', 'skip'].includes(event.Action)) continue;
            if (terminal.has(event.Test)) {
              throw new Error(`${suite}: ${event.Test} reported more than one terminal action`);
            }
            terminal.set(event.Test, event.Action);
          }

          const counts = { pass: 0, fail: 0, skip: 0 };
          const failed = [];
          const skipped = [];
          for (const [name, action] of terminal) {
            counts[action] += 1;
            if (action === 'fail') failed.push(name);
            if (action === 'skip') skipped.push(name);
          }

          if (counts.pass === 0) {
            throw new Error(`${suite}: no test reported a pass; a suite that ran nothing is not a green suite`);
          }
          if (failed.length > 0) {
            throw new Error(`${suite}: failures: ${failed.slice(0, 20).join(', ')}`);
          }

          // Skips are named rather than absorbed into a total: these packages
          // contain tests gated on services this job does not provide, and a
          // skip that should not be there has to be visible.
          const report = [
            `suite=${suite}`,
            `pass=${counts.pass}`,
            `fail=${counts.fail}`,
            `skip=${counts.skip}`,
            skipped.length ? `skipped: ${skipped.join(', ')}` : 'skipped: none',
          ].join('\n');
          process.stdout.write(`${report}\n`);
          fs.writeFileSync(`${file}.summary.txt`, `${report}\n`);
          NODE

      - name: Upload JSON test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loretide-db-suite-${{ matrix.slug }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/${{ matrix.slug }}.jsonl
            ${{ runner.temp }}/${{ matrix.slug }}.jsonl.summary.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Drop only this run's isolated database and role
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ || ! "${GITHUB_RUN_ATTEMPT:-}" =~ ^[0-9]+$ ]]; then
            echo "::error::invalid GitHub run identity; refusing cleanup"
            exit 1
          fi

          expected_db="loretide_db_test_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          expected_role="loretide_db_role_${{ matrix.slug }}_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          if [[ "${LORETIDE_DB_TEST_DATABASE:-}" != "$expected_db" ||
                "${LORETIDE_DB_TEST_ROLE:-}" != "$expected_role" ]]; then
            echo "::error::run-derived database identifiers are missing or inconsistent; refusing terminate/drop"
            exit 1
          fi

          sudo -u postgres psql -X -v ON_ERROR_STOP=1 -q \
            -v db_name="$expected_db" -v role_name="$expected_role" <<'SQL'
          SELECT pg_terminate_backend(pid)
            FROM pg_stat_activity
           WHERE datname = :'db_name' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS :"db_name";
          DROP ROLE IF EXISTS :"role_name";
          SQL
