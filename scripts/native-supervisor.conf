[unix_http_server]
file=%(here)s/../data/native/supervisor.sock
chmod=0600

[supervisord]
logfile=%(here)s/../data/native/logs/supervisor.log
logfile_maxbytes=10MB
logfile_backups=3
pidfile=%(here)s/../data/native/supervisor.pid
childlogdir=%(here)s/../data/native/logs

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(here)s/../data/native/supervisor.sock

[program:postgres]
command=/bin/bash %(here)s/native-service.sh postgres
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=10
stopasgroup=true
killasgroup=true
stopsignal=INT
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(here)s/../data/native/logs/postgres-supervised.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:api]
command=/bin/bash %(here)s/native-service.sh api
priority=20
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(here)s/../data/native/logs/api-supervised.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

[program:web]
command=/bin/bash %(here)s/native-service.sh web
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=10
stopasgroup=true
killasgroup=true
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=%(here)s/../data/native/logs/web-supervised.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
